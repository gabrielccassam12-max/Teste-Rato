name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'
      - name: Achar o projeto
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::Não achei settings.gradle. Os arquivos do projeto foram enviados?"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Projeto em: $(dirname "$f")"
      - name: Compilar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: mutant-rat-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
